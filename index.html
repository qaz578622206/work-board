<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>金融工作 · 进度看板</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --line:#e6e8ec; --text:#1f2430; --sub:#6b7280;
    --green:#16a34a; --greenbg:#e9f7ef;
    --yellow:#b45309; --yellowbg:#fdf3e3;
    --blue:#2563eb; --bluebg:#e9f0fe;
    --red:#dc2626; --redbg:#fdeaea;
    --gray:#64748b; --graybg:#eef1f5;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.65 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  header{background:#fff;border-bottom:1px solid var(--line);padding:22px 28px 16px}
  h1{margin:0 0 4px;font-size:22px;letter-spacing:.5px}
  .meta{color:var(--sub);font-size:13px}
  .stats{display:flex;gap:26px;margin:16px 0 4px;flex-wrap:wrap}
  .stat b{display:block;font-size:24px;line-height:1.2}
  .stat span{color:var(--sub);font-size:12.5px}
  .filters{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
  .filters button{border:1px solid var(--line);background:#fff;color:var(--text);
    padding:6px 14px;border-radius:20px;cursor:pointer;font-size:13.5px}
  .filters button:hover{border-color:#c9ced8}
  .filters button.on{background:var(--text);color:#fff;border-color:var(--text)}
  .tabs{display:flex;gap:2px;margin:16px 0 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .tabs button{border:0;background:none;padding:9px 16px;font-size:14.5px;cursor:pointer;
    color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit}
  .tabs button.on{color:var(--text);font-weight:600;border-bottom-color:var(--text)}
  main{display:grid;grid-template-columns:repeat(auto-fill,minmax(390px,1fr));
    gap:16px;padding:20px 28px 40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px 18px;display:flex;flex-direction:column;gap:10px}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .name{font-size:16.5px;font-weight:600}
  .subject{color:var(--sub);font-size:12.5px;margin-top:2px;word-break:break-all}
  .badge{font-size:12px;padding:3px 10px;border-radius:20px;white-space:nowrap;font-weight:600}
  .b-green{color:var(--green);background:var(--greenbg)}
  .b-yellow{color:var(--yellow);background:var(--yellowbg)}
  .b-blue{color:var(--blue);background:var(--bluebg)}
  .b-red{color:var(--red);background:var(--redbg)}
  .b-gray{color:var(--gray);background:var(--graybg)}
  .summary{font-size:14px}
  .amt{font-size:13px;color:var(--sub)}
  .amt b{color:var(--text);font-size:14.5px}
  .sec-title{font-size:12.5px;color:var(--sub);margin-bottom:2px;font-weight:600}
  ul{margin:0;padding-left:18px}
  li{font-size:13.5px;margin:2px 0}
  .next{background:#f8f9fb;border-left:3px solid #cbd5e1;padding:8px 10px;border-radius:6px;font-size:13.5px}
  .foot{color:var(--sub);font-size:12px;margin-top:auto;padding-top:6px;border-top:1px dashed var(--line)}
  footer{padding:0 28px 40px;color:var(--sub);font-size:12.5px}
  /* ---- 审批进度 ---- */
  .steps{display:flex;gap:3px}
  .steps i{flex:1;height:6px;border-radius:3px;background:#e9ecf1}
  .steps i.done{background:var(--green)}
  .steps i.now{background:var(--blue)}
  .steps i.dead{background:#f0b4b4}
  .legend{display:flex;gap:3px;font-size:10px;color:var(--sub);text-align:center}
  .legend span{flex:1;overflow:hidden;white-space:nowrap}
  .legend span.now{color:var(--blue);font-weight:700}
  .conds details{border-top:1px dashed var(--line);padding-top:7px}
  .conds summary{cursor:pointer;font-size:12.8px;color:var(--sub);font-weight:600;outline:none}
  .conds ul{margin:6px 0 0;padding-left:17px}
  .conds li{font-size:12.8px;color:#374151}
  .byline{font-size:12px;color:var(--sub)}
  @media(max-width:560px){
    main{padding:16px 14px 30px;grid-template-columns:1fr}
    header{padding:18px 14px 14px}
    .stats{gap:20px}
    .legend{font-size:9px}
  }
  /* ---- 记一笔 / 收件箱 ---- */
  .acts{display:flex;justify-content:flex-end;margin-top:2px}
  .act{border:1px dashed #cbd5e1;background:#fff;color:var(--sub);font-size:12.5px;
    padding:4px 12px;border-radius:8px;cursor:pointer;font-family:inherit}
  .act:hover{border-color:var(--blue);color:var(--blue)}
  .note-box{margin-top:2px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fbfcfe}
  .note-box textarea{width:100%;min-height:72px;border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;font:13.5px/1.6 inherit;outline:none;resize:vertical;color:var(--text)}
  .note-box textarea:focus{border-color:#9aa6b8}
  .note-acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
  .note-acts button{border:0;border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;font-family:inherit}
  .nb-primary{background:var(--text);color:#fff}
  .nb-primary:hover{opacity:.9}
  .nb-ghost{background:#eef1f5;color:var(--text)}
  .nb-ghost:hover{background:#e4e8ef}
  .note-tip{font-size:11.5px;color:var(--sub);margin-top:8px;line-height:1.6}
  .flash{background:var(--greenbg);color:var(--green);border-radius:8px;padding:5px 10px;font-size:12.5px;margin-top:8px}
  .nb-slot:empty{display:none}
  .group-tag{align-self:flex-start;font-size:11.5px;font-weight:600;color:#7c3aed;
    background:#f3e8ff;border-radius:20px;padding:2px 10px}
  .note-manual{background:#fff8e6;border-left:3px solid #f0b429;padding:8px 10px;
    border-radius:6px;font-size:13.5px;line-height:1.6}
  #inboxWrap{padding:20px 28px 40px;max-width:900px}
  .inbox-item{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff;margin-bottom:10px}
  .inbox-item .t{font-size:14.5px;font-weight:600}
  .inbox-item .b{font-size:13.5px;white-space:pre-wrap;margin-top:5px;color:#374151}
  .inbox-item .m{font-size:11.5px;color:var(--sub);margin-top:7px}
  .inbox-empty{color:var(--sub);font-size:13.5px;line-height:1.9}
  @media(max-width:560px){#inboxWrap{padding:16px 14px 30px}}
  #lock{position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#eef1f6,#e2e8f1);
    display:flex;align-items:center;justify-content:center;padding:20px}
  #lock .box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:34px 30px;
    width:100%;max-width:340px;text-align:center;box-shadow:0 12px 40px rgba(20,30,50,.10)}
  #lock h2{margin:0 0 6px;font-size:19px;font-weight:600}
  #lock p{margin:0 0 18px;color:var(--sub);font-size:13px}
  #lock input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;
    font-size:15px;text-align:center;letter-spacing:2px;outline:none}
  #lock input:focus{border-color:#9aa6b8}
  #lock button{margin-top:12px;width:100%;padding:11px;border:0;border-radius:9px;
    background:var(--text);color:#fff;font-size:15px;cursor:pointer}
  #lock button:hover{opacity:.9}
  #lock .err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}</style>
</head>

const FILTER_DEFS = [
  {key:'all',    text:'全部'},
  {key:'yellow', text:'等客户补件'},
  {key:'green',  text:'可提交 / 已放款'},
  {key:'blue',   text:'进行中'},

const AFILTER_DEFS = [
  {key:'all',    text:'全部'},
  {key:'live',   text:'审批中'},

  {key:'done',   text:'已生效'},
  {key:'dead',   text:'已结束'}
];

let cur = 'all';       // 在办事项筛选
let acur = 'all';      // 审批进度筛选

function counts(){
  return {
    total: ITEMS.length,
    waiting: ITEMS.filter(i=>i.status==='yellow').length,
    done: ITEMS.filter(i=>i.status==='green').length,
    ongoing: ITEMS.filter(i=>i.status==='blue').length
  };
}
function acounts(){
  return {
    total: DEALS.length,
    live: DEALS.filter(d=>d.group==='live').length,
    open: DEALS.filter(d=>d.group==='open').length,
    done: DEALS.filter(d=>d.group==='done').length,
    dead: DEALS.filter(d=>d.group==='dead').length
  };
}
function renderStats(){
  const c = counts();
  STATS.innerHTML = `
    <div class="stat"><b>${c.total}</b><span>在办事项</span></div>
    <div class="stat"><b>${c.waiting}</b><span>等客户补件</span></div>
    <div class="stat"><b>${c.done}</b><span>可提交 / 已放款</span></div>
    <div class="stat"><b>${c.ongoing}</b><span>推进中</span></div>`;
  const a = acounts();
  ASTATS.innerHTML = `
    <div class="stat"><b>${a.total}</b><span>申请笔数</span></div>
    <div class="stat"><b>${a.live}</b><span>审批中</span></div>
    <div class="stat"><b>${a.open}</b><span>待客户 / 待确认</span></div>
    <div class="stat"><b>${a.done}</b><span>已生效</span></div>
    <div class="stat"><b>${a.dead}</b><span>已结束</span></div>`;
}
function renderFilters(){
  FILTERS.innerHTML = FILTER_DEFS.map(f=>
    `<button data-k="${f.key}" class="${f.key===cur?'on':''}">${f.text}</button>`).join('');
  FILTERS.querySelectorAll('button').forEach(b=>b.onclick=()=>{cur=b.dataset.k;renderFilters();renderBoard();});
  AFILTERS.innerHTML = AFILTER_DEFS.map(f=>
    `<button data-k="${f.key}" class="${f.key===acur?'on':''}">${f.text}</button>`).join('');
  AFILTERS.querySelectorAll('button').forEach(b=>b.onclick=()=>{acur=b.dataset.k;renderFilters();renderBoard();});
}
function renderTabs(){
  TABS.querySelectorAll('button').forEach(b=>{
    b.classList.toggle('on', b.dataset.v===view);
    b.onclick = () => {
      view = b.dataset.v;
      renderTabs(); renderBoard();
      if (view === 'inbox' && !inboxLoaded) { inboxLoaded = true; loadInbox(); }
    };
  });
  document.getElementById('pane-work').style.display     = view==='work'     ? '' : 'none';
  document.getElementById('pane-approval').style.display = view==='approval' ? '' : 'none';
  document.getElementById('pane-inbox').style.display    = view==='inbox'    ? '' : 'none';
  document.getElementById('inboxWrap').style.display     = view==='inbox'    ? '' : 'none';
  BOARD.style.display = view==='inbox' ? 'none' : '';
}

function noteBtn(key, name){
  return `<div class="acts"><button class="act" data-note="${key}" data-name="${String(name).replace(/&/g,'&amp;').replace(/"/g,'&quot;')}">✍ 记一笔</button></div>`;
}

function workCard(i, idx){
  return `
    <div class="card">
      <div class="card-top">
        <div>
          <div class="name">${i.name}</div>
          <div class="subject">${i.subject}</div>
        </div>
        <div class="badge b-${i.status}">${i.label}</div>
      </div>
      ${i.amount && i.amount!=='—' ? `<div class="amt">${i.amount}</div>` : ''}
      <div class="summary">${i.summary}</div>
      ${i.gaps && i.gaps.filter(g=>g!=='—').length ? `
        <div>
          <div class="sec-title">缺口 / 待补</div>
          <ul>${i.gaps.filter(g=>g!=='—').map(g=>`<li>${g}</li>`).join('')}</ul>
        </div>` : ''}
      ${i.next && i.next!=='—' ? `<div class="next"><b>下一步：</b>${i.next}</div>` : ''}
      <div class="foot">最后更新：${i.updated}</div>
      ${noteBtn('w'+idx, i.name)}
      <div class="nb-slot"></div>
    </div>`;
}

function dealCard(d, idx){
  const step = d.step;                       // 1..7，已结束为 0
  const bars = STAGES.map((_,k)=>{
    const n = k+1;
    if(d.dead) return `<i class="dead"></i>`;
    if(n < step) return `<i class="done"></i>`;
    if(n === step) return `<i class="now"></i>`;
    return `<i></i>`;
  }).join('');
  const legend = STAGES.map((s,k)=>
    `<span class="${!d.dead && k+1===step?'now':''}">${s}</span>`).join('');
  return `
    <div class="card">
      ${d.groupName ? `<div class="group-tag">⛓ ${d.groupName}</div>` : ''}
      <div class="card-top">
        <div>
          <div class="name">${d.client}</div>
          <div class="subject">${d.subject || ''}</div>
        </div>
        <div class="badge b-${d.tone}">${d.stageLabel}</div>
      </div>
      <div class="amt">
        ${d.amount ? `金额 <b>${d.amount}</b>` : '金额 待定'}
        ${d.reqLimit && d.reqLimit!=='--' ? ` · 申请额度 ${d.reqLimit}` : ''}
        ${d.reqRate ? ` · 申请利率 ${d.reqRate}` : ''}
        ${d.rating && d.rating!=='--' ? ` · 客户评级 <b>${d.rating}</b>` : ''}
      </div>
      <div class="steps">${bars}</div>
      <div class="legend">${legend}</div>
      <div class="byline">风控 ${d.analyst && d.analyst!=='无所有者' ? d.analyst : '未分配'}　·　业务 ${d.owner || '—'}${d.qyd && d.qyd!=='--' ? `　·　${d.qyd}` : ''}</div>
      ${d.latest ? `<div class="next"><b>最新动态：</b>${d.latest}</div>` : ''}
      ${d.note ? `<div class="note-manual"><b>你记的：</b>${d.note}</div>` : ''}
      ${d.conditions && d.conditions.length ? `
        <div class="conds">
          <details>
            <summary>审批结论 / 风控要求（${d.conditions.length} 条）</summary>
            <ul>${d.conditions.map(c=>`<li>${c}</li>`).join('')}</ul>
          </details>
        </div>` : ''}
      <div class="foot">阶段：${d.stage}</div>
      ${noteBtn('d'+idx, d.client)}
      <div class="nb-slot"></div>
    </div>`;
}

function renderBoard(){
  const list = view==='work'
    ? (cur==='all' ? ITEMS : ITEMS.filter(i=>i.status===cur))
    : (acur==='all' ? DEALS : DEALS.filter(d=>d.group===acur));
  if(!list.length){ BOARD.innerHTML = '<p style="color:#6b7280">这一类暂无事项。</p>'; return; }
  BOARD.innerHTML = view==='work' ? list.map(workCard).join('') : list.map(dealCard).join('');
}

function pad2(n){ return String(n).padStart(2,'0'); }
function nowStr(){
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
function escHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function saveLocal(name, text){
  try{
    const k = 'wb_notes';
    const arr = JSON.parse(localStorage.getItem(k) || '[]');
    arr.unshift({ name: name, text: text, at: nowStr() });
    localStorage.setItem(k, JSON.stringify(arr.slice(0, 80)));
  }catch(e){}
}
function flash(slot, msg){
  const box = slot.querySelector('.note-box'); if(!box) return;
  let f = box.querySelector('.flash');
  if(!f){ f = document.createElement('div'); f.className = 'flash'; box.appendChild(f); }
  f.textContent = msg;
}
function fallbackCopy(s, done){
  try{
    const ta = document.createElement('textarea');
    ta.value = s; ta.style.position = 'fixed'; ta.style.top = '-1000px';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    done();
  }catch(e){}
}
const NOTE_TIP =
  '<div class="note-tip">' +
  '「发送到收件箱」→ 打开提交页，点一下提交，内容就落到收件箱；我开机第一件事就是读它、并进看板。<br>' +
  '不想登录 GitHub 就点「复制」，把这段话粘到聊天里发我，一样能同步。' +
  '</div>';

function openNote(btn){
  const card = btn.closest('.card'); if(!card) return;
  let slot = card.querySelector('.nb-slot');
  if(!slot){ slot = document.createElement('div'); slot.className = 'nb-slot'; card.appendChild(slot); }
  if (slot.innerHTML) { slot.innerHTML = ''; return; }   // 再点一次收起
  const name = btn.dataset.name || '未命名';
  slot.innerHTML =
    '<div class="note-box">' +
      '<textarea placeholder="随手记 —— 最新进展、想到的事、要我跟进的…"></textarea>' +
      '<div class="note-acts">' +
        '<button class="nb-primary" data-send="1">发送到收件箱</button>' +
        '<button class="nb-ghost" data-copy="1">复制</button>' +
        '<button class="nb-ghost" data-cancel="1">收起</button>' +
      '</div>' + NOTE_TIP +
    '</div>';
  const ta = slot.querySelector('textarea');
  slot.querySelector('[data-cancel]').onclick = () => { slot.innerHTML = ''; };
  slot.querySelector('[data-send]').onclick = () => {
    const t = (ta.value || '').trim();
    if (!t) { flash(slot, '还没写内容呢'); return; }
    saveLocal(name, t);
    const title = INBOX_PREFIX + name;
    const body = t + '\n\n---\n来自看板：' + name + '\n时间：' + nowStr();
    const u = 'https://github.com/' + REPO + '/issues/new?title=' +
              encodeURIComponent(title) + '&body=' + encodeURIComponent(body);
    window.open(u, '_blank');
    flash(slot, '已打开提交页 —— 在那边点一下「Submit new issue」就进收件箱了');
  };
  slot.querySelector('[data-copy]').onclick = (ev) => {
    const t = (ta.value || '').trim();
    if (!t) { flash(slot, '还没写内容呢'); return; }
    saveLocal(name, t);
    const s = '【' + name + '】' + t;
    const done = () => { ev.target.textContent = '已复制'; setTimeout(() => { ev.target.textContent = '复制'; }, 1600); };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(s).then(done).catch(() => fallbackCopy(s, done));
    } else { fallbackCopy(s, done); }
  };
  ta.focus();
}
document.addEventListener('click', (e) => {
  const b = e.target && e.target.closest ? e.target.closest('.act') : null;
  if (b) openNote(b);
});

function loadInbox(){
  const list = document.getElementById('inboxList');
  const stat = document.getElementById('inboxStat');
  stat.textContent = '正在读取收件箱…';
  list.innerHTML = '';
  fetch('https://api.github.com/repos/' + REPO + '/issues?state=open&per_page=100')
    .then(r => { if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(arr => {
      const items = (arr || []).filter(i => !i.pull_request && String(i.title || '').indexOf(INBOX_PREFIX) === 0);
      if (!items.length) {
        stat.textContent = '收件箱是空的 —— 想到什么就在任意卡片上点「记一笔」。';
        list.innerHTML =
          '<div class="inbox-empty">' +
          '· 在「在办事项」或「风控审批进度」里，点卡片右下角的「✍ 记一笔」；<br>' +
          '· 写下最新情况，点「发送到收件箱」，在打开的页面点一下提交；<br>' +
          '· 我下次开工第一件事就是读收件箱，把它并进看板与记录。</div>';
        return;
      }
      stat.textContent = '收件箱有 ' + items.length + ' 条待同步。我开机后会读走并并进看板。';
      list.innerHTML = items.map(it => {
        const body = String(it.body || '').split('\n---\n')[0];
        return '<div class="inbox-item">' +
          '<div class="t">' + escHtml(String(it.title || '').replace(INBOX_PREFIX, '')) + '</div>' +
          '<div class="b">' + escHtml(body) + '</div>' +
          '<div class="m">#' + it.number + ' · ' + new Date(it.created_at).toLocaleString('zh-CN') + '</div>' +
          '</div>';
      }).join('');
    })
    .catch(() => {
      stat.textContent = '收件箱读取失败（网络或超时）。';
      list.innerHTML = '<div class="inbox-empty">可以直接用「复制」把内容发我，一样能同步。</div>';
    });
}

renderStats(); renderFilters(); renderTabs(); renderBoard();

/* ---- 口令锁（前端保护，用于挡住随手点开的人） ---- */
const HASH = 'c2860769';
function h(s){ let x = 5381; for (let i = 0; i < s.length; i++) { x = ((x << 5) + x + s.charCodeAt(i)) >>> 0; } return x.toString(16); }
const lockEl = document.getElementById('lock');
function unlock(){ if (lockEl) lockEl.style.display = 'none'; }
if (sessionStorage.getItem('wb_ok') === HASH) { unlock(); }
const pwEl = document.getElementById('lockpw');
const btnEl = document.getElementById('lockbtn');
if (btnEl) btnEl.onclick = () => {
  if (h(pwEl.value) === HASH) { sessionStorage.setItem('wb_ok', HASH); unlock(); }
  else { document.getElementById('lockerr').textContent = '口令不对'; }
};
if (pwEl) pwEl.addEventListener('keydown', e => { if (e.key === 'Enter' && btnEl) btnEl.click(); });
</script>
