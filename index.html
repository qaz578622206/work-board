<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>金融工作 · 进度看板</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --line:#e6e8ec; --text:#1f2430; --sub:#6b7280;
    --green:#16a34a; --greenbg:#e9f7ef;
    --yellow:#b45309; --yellowbg:#fdf3e3;
    --blue:#2563eb; --bluebg:#e9f0fe;
    --red:#dc2626; --redbg:#fdeaea;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.65 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  header{background:#fff;border-bottom:1px solid var(--line);padding:22px 28px 16px}
  h1{margin:0 0 4px;font-size:22px;letter-spacing:.5px}
  .meta{color:var(--sub);font-size:13px}
  .stats{display:flex;gap:26px;margin:16px 0 4px;flex-wrap:wrap}
  .stat b{display:block;font-size:24px;line-height:1.2}
  .stat span{color:var(--sub);font-size:12.5px}
  .filters{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
  .filters button{border:1px solid var(--line);background:#fff;color:var(--text);
    padding:6px 14px;border-radius:20px;cursor:pointer;font-size:13.5px}
  .filters button:hover{border-color:#c9ced8}
  .filters button.on{background:var(--text);color:#fff;border-color:var(--text)}
  main{display:grid;grid-template-columns:repeat(auto-fill,minmax(390px,1fr));
    gap:16px;padding:20px 28px 40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px 18px;display:flex;flex-direction:column;gap:10px}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .name{font-size:16.5px;font-weight:600}
  .subject{color:var(--sub);font-size:12.5px;margin-top:2px;word-break:break-all}
  .badge{font-size:12px;padding:3px 10px;border-radius:20px;white-space:nowrap;font-weight:600}
  .b-green{color:var(--green);background:var(--greenbg)}
  .b-yellow{color:var(--yellow);background:var(--yellowbg)}
  .b-blue{color:var(--blue);background:var(--bluebg)}
  .b-red{color:var(--red);background:var(--redbg)}
  .summary{font-size:14px}
  .amt{font-size:13px;color:var(--sub)}
  .amt b{color:var(--text);font-size:14.5px}
  .sec-title{font-size:12.5px;color:var(--sub);margin-bottom:2px;font-weight:600}
  ul{margin:0;padding-left:18px}
  li{font-size:13.5px;margin:2px 0}
  .next{background:#f8f9fb;border-left:3px solid #cbd5e1;padding:8px 10px;border-radius:6px;font-size:13.5px}
  .foot{color:var(--sub);font-size:12px;margin-top:auto;padding-top:6px;border-top:1px dashed var(--line)}
  footer{padding:0 28px 40px;color:var(--sub);font-size:12.5px}
  @media(max-width:560px){main{padding:16px 14px 30px}header{padding:18px 14px 14px}}
  #lock{position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#eef1f6,#e2e8f1);
    display:flex;align-items:center;justify-content:center;padding:20px}
  #lock .box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:34px 30px;
    width:100%;max-width:340px;text-align:center;box-shadow:0 12px 40px rgba(20,30,50,.10)}
  #lock h2{margin:0 0 6px;font-size:19px;font-weight:600}
  #lock p{margin:0 0 18px;color:var(--sub);font-size:13px}
  #lock input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;
    font-size:15px;text-align:center;letter-spacing:2px;outline:none}
  #lock input:focus{border-color:#9aa6b8}
  #lock button{margin-top:12px;width:100%;padding:11px;border:0;border-radius:9px;
    background:var(--text);color:#fff;font-size:15px;cursor:pointer}
  #lock button:hover{opacity:.9}
  #lock .err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}</style>
</head>
<body>

    <h2>金融工作 · 进度看板</h2>

    <input id="lockpw" type="password" placeholder="口令" autocomplete="off">
    <button id="lockbtn">进入</button>
    <div class="err" id="lockerr"></div>
  </div>

<main id="board"></main>

const BOARD = document.getElementById('board');
const STATS = document.getElementById('stats');
const FILTERS = document.getElementById('filters');
const FILTER_DEFS = [
  {key:'all',    text:'全部'},
  {key:'yellow', text:'等客户补件'},
  {key:'green',  text:'可提交 / 已放款'},
  {key:'blue',   text:'进行中'},
  {key:'red',    text:'已结案'}
];
let cur = 'all';

function counts(){
  return {
    total: ITEMS.length,
    waiting: ITEMS.filter(i=>i.status==='yellow').length,
    done: ITEMS.filter(i=>i.status==='green').length,
    ongoing: ITEMS.filter(i=>i.status==='blue').length
  };
}
function renderStats(){
  const c = counts();
  STATS.innerHTML = `
    <div class="stat"><b>${c.total}</b><span>在办事项</span></div>
    <div class="stat"><b>${c.waiting}</b><span>等客户补件</span></div>
    <div class="stat"><b>${c.done}</b><span>可提交 / 已放款</span></div>
    <div class="stat"><b>${c.ongoing}</b><span>推进中</span></div>`;
}
function renderFilters(){
  FILTERS.innerHTML = FILTER_DEFS.map(f=>
    `<button data-k="${f.key}" class="${f.key===cur?'on':''}">${f.text}</button>`).join('');
  FILTERS.querySelectorAll('button').forEach(b=>b.onclick=()=>{cur=b.dataset.k;renderFilters();renderBoard();});
}
function renderBoard(){
  const list = cur==='all' ? ITEMS : ITEMS.filter(i=>i.status===cur);
  if(!list.length){ BOARD.innerHTML = '<p style="color:#6b7280">这一类暂无事项。</p>'; return; }
  BOARD.innerHTML = list.map(i=>`
    <div class="card">
      <div class="card-top">
        <div>
          <div class="name">${i.name}</div>
          <div class="subject">${i.subject}</div>
        </div>
        <div class="badge b-${i.status}">${i.label}</div>
      </div>
      ${i.amount && i.amount!=='—' ? `<div class="amt">${i.amount}</div>` : ''}
      <div class="summary">${i.summary}</div>
      ${i.gaps && i.gaps.filter(g=>g!=='—').length ? `
        <div>
          <div class="sec-title">缺口 / 待补</div>
          <ul>${i.gaps.filter(g=>g!=='—').map(g=>`<li>${g}</li>`).join('')}</ul>
        </div>` : ''}
      ${i.next && i.next!=='—' ? `<div class="next"><b>下一步：</b>${i.next}</div>` : ''}
      <div class="foot">最后更新：${i.updated}</div>
    </div>`).join('');
}
renderStats(); renderFilters(); renderBoard();
/* ---- 口令锁（前端保护，用于挡住随手点开的人） ---- */
const HASH = 'c2860769';
function h(s){ let x = 5381; for (let i = 0; i < s.length; i++) { x = ((x << 5) + x + s.charCodeAt(i)) >>> 0; } return x.toString(16); }
const lockEl = document.getElementById('lock');
function unlock(){ if (lockEl) lockEl.style.display = 'none'; }
if (sessionStorage.getItem('wb_ok') === HASH) { unlock(); }
const pwEl = document.getElementById('lockpw');
const btnEl = document.getElementById('lockbtn');
if (btnEl) btnEl.onclick = () => {
  if (h(pwEl.value) === HASH) { sessionStorage.setItem('wb_ok', HASH); unlock(); }
  else { document.getElementById('lockerr').textContent = '口令不对'; }
};
if (pwEl) pwEl.addEventListener('keydown', e => { if (e.key === 'Enter' && btnEl) btnEl.click(); });
